</style></head><body><main class="w"><section class="c"><a href="./">← 回測驗</a><h1>匿名研究資料分析器</h1><p class="muted">把多位受測者從結果頁匯出的 JSON 一次選進來。所有分析都在這個瀏覽器本機完成，檔案不會上傳。</p>
<input id="files" type="file" accept=".json,application/json" multiple><button class="btn" id="run">開始分析</button><div id="out"></div>

var META=[{"n":1,"stem":"參加一個幾乎都不認識人的聚會時，你通常會","axis":"EI","a_side":"E","b_side":"I"},{"n":2,"stem":"學一個全新的概念時，你比較容易進入狀況的方式是","axis":"SN","a_side":"S","b_side":"N"},{"n":3,"stem":"團隊成員犯錯時，你比較自然的第一反應是","axis":"TF","a_side":"T","b_side":"F"},{"n":4,"stem":"出發旅行前，你比較喜歡","axis":"JP","a_side":"J","b_side":"P"},{"n":5,"stem":"兩個方案各有利弊時，你比較依賴","axis":"TF","a_side":"F","b_side":"T"},{"n":6,"stem":"面對一個月後的截止日，你通常","axis":"JP","a_side":"P","b_side":"J"},{"n":7,"stem":"開會討論新點子時，你比較自然的是","axis":"EI","a_side":"I","b_side":"E"},{"n":8,"stem":"聽完一段複雜說明後，你通常比較容易記住","axis":"SN","a_side":"N","b_side":"S"},{"n":9,"stem":"看到一組新資料時，你通常先做的是","axis":"SN","a_side":"S","b_side":"N"},{"n":10,"stem":"忙了一整天後，你比較能恢復精神的方式是","axis":"EI","a_side":"E","b_side":"I"},{"n":11,"stem":"臨時取消原本的安排時，你通常","axis":"JP","a_side":"J","b_side":"P"},{"n":12,"stem":"朋友遇到工作問題向你訴苦時，你通常先","axis":"TF","a_side":"T","b_side":"F"},{"n":13,"stem":"工作桌或數位檔案比較亂時，你通常","axis":"JP","a_side":"P","b_side":"J"},{"n":14,"stem":"需要給別人負面回饋時，你更在意","axis":"TF","a_side":"F","b_side":"T"},{"n":15,"stem":"別人教你操作一套新系統時，你比較喜歡","axis":"SN","a_side":"N","b_side":"S"},{"n":16,"stem":"搭電梯遇到不熟的同事時，你通常","axis":"EI","a_side":"I","b_side":"E"},{"n":17,"stem":"要認識一個新團隊，你比較傾向","axis":"EI","a_side":"E","b_side":"I"},{"n":18,"stem":"閱讀一篇文章時，你比較自然會注意","axis":"SN","a_side":"S","b_side":"N"},{"n":19,"stem":"遇到規則與特殊個案衝突時，你比較傾向","axis":"TF","a_side":"T","b_side":"F"},{"n":20,"stem":"同時有幾件事要做時，你比較喜歡","axis":"JP","a_side":"J","b_side":"P"},{"n":21,"stem":"朋友約聚餐時，你比較喜歡","axis":"JP","a_side":"P","b_side":"J"},{"n":22,"stem":"做重大決策時，你比較擔心","axis":"TF","a_side":"F","b_side":"T"},{"n":23,"stem":"當你有一件很開心的事時，你通常","axis":"EI","a_side":"I","b_side":"E"},{"n":24,"stem":"第一次到一個陌生地方，你比較容易留下印象的是","axis":"SN","a_side":"N","b_side":"S"},{"n":25,"stem":"討論一個問題時，你比較常從哪裡開始","axis":"SN","a_side":"S","b_side":"N"},{"n":26,"stem":"一段長時間的社交活動結束後，你通常","axis":"EI","a_side":"E","b_side":"I"},{"n":27,"stem":"遇到還沒決定的事情，你通常","axis":"JP","a_side":"J","b_side":"P"},{"n":28,"stem":"討論爭議議 S"},{"n":56,"stem":"遇到值得慶祝的成果，你第一個念頭比較可能是","axis":"EI","a_side":"I","b_side":"E"},{"n":57,"stem":"在課程或演講的 Q&A 時間，你比較可能","axis":"EI","a_side":"E","b_side":"I"},{"n":58,"stem":"看到一個新產品時，你比較容易先注意","axis":"SN","a_side":"S","b_side":"N"},{"n":59,"stem":"做選擇時，你比較常問自己","axis":"TF","a_side":"T","b_side":"F"},{"n":60,"stem":"活動開始前，你比較喜歡","axis":"JP","a_side":"J","b_side":"P"},{"n":61,"stem":"如果原本預定下午做 A，突然有人邀你做 B，你通常","axis":"JP","a_side":"P","b_side":"J"},{"n":62,"stem":"處理衝突時，你比較容易先做的是","axis":"TF","a_side":"F","b_side":"T"},{"n":63,"stem":"當一段說明很抽象時，你通常會希望","axis":"SN","a_side":"N","b_side":"S"},{"n":64,"stem":"認識新朋友時，你通常","axis":"EI","a_side":"I","b_side":"E"},{"n":65,"stem":"如果工作可以自由選擇環境，你較偏好","axis":"EI","a_side":"E","b_side":"I"},{"n":66,"stem":"當你需要理解陌生產業時，你比較自然會","axis":"SN","a_side":"S","b_side":"N"},{"n":67,"stem":"如果一項決定對整體最有效率、但少數人會受影響，你較傾向","axis":"TF","a_side":"T","b_side":"F"},{"n":68,"stem":"你比較喜歡哪種工作狀態","axis":"JP","a_side":"J","b_side":"P"}];
function mean(a){return a.reduce(function(s,x){return s+x},0)/a.length}
function median(a){if(!a.length)return null;var b=a.slice().sort(function(x,y){return x-y}),m=Math.floor(b.length/2);return b.length%2?b[m]:(b[m-1]+b[m])/2}
function variance(a){if(a.length<2)return 0;var m=mean(a);return a.reduce(function(s,x){return s+(x-m)*(x-m)},0)/(a.length-1)}
function corr(x,y){if(x.length<3)return null;var mx=mean(x),my=mean(y),sx=0,sy=0,sxy=0;for(var i=0;i<x.length;i++){var dx=x[i]-mx,dy=y[i]-my;sx+=dx*dx;sy+=dy*dy;sxy+=dx*dy}return sx&&sy?sxy/Math.sqrt(sx*sy):null}
function alpha(rows){if(rows.length<3||!rows[0]||rows[0].length<2)return null;var k=rows[0].length,cols=[];for(var j=0;j<k;j++)cols.push(rows.map(function(r){return r[j]}));var total=rows.map(function(r){return r.reduce(function(s,x){return s+x},0)}),vt=variance(total);if(!vt)return null;var sumv=cols.reduce(function(s,col){return s+variance(col)},0);return k/(k-1)*(1-sumv/vt)}
function esc(s){return String(s).replace(/[&<>"]/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]})}
function readFile(f){return new Promise(function(resolve,reject){var r=new FileReader();r.onload=function(){try{resolve(JSON.parse(r.result))}catch(e){reject(e)}};r.onerror=reject;r.readAsText(f)})}
document.getElementById("run").onclick=async function(){
 var fs=[].slice.call(document.getElementById("files").files); if(!fs.length){alert("請先選 JSON 檔");return}
 var data=[];for(var i=0;i<fs.length;i++){try{var d=await readFile(fs[i]);if((d.schema_version==="mbti-research-v1"||d.schema_version==="mbti-research-v2")&&d.answer_string&&d.answer_string.length>=68)data.push(d)}catch(e){}}
 if(!data.length){document.getElementById("out").innerHTML='<div class="box">沒有讀到有效的 mbti-research-v1 資料。</div>';return}
 var times=data.map(function(d){return d.elapsed_seconds}).filter(function(x){return Number.isFinite(x)}), types={},versions={};data.forEach(function(d){types[d.reference_type]=(types[d.reference_type]||0)+1;var v=d.test_version||"未知版本";versions[v]=(versions[v]||0)+1});
 var val=data.filter(function(d){return d.prior_reference_type&&/^[EI][SN][TF][JP]$/.test(d.prior_reference_type)&&/^[EI][SN][TF][JP]$/.test(d.reference_type)});
 var agr={EI:[0,0],SN:[0,0],TF:[0,0],JP:[0,0]};
 val.forEach(function(d){var pairs=[["EI",0],["SN",1],["TF",2],["JP",3]];pairs.forEach(function(p){agr[p[0]][1]++;if(d.reference_type[p[1]]===d.prior_reference_type[p[1]])agr[p[0]][0]++})});
 var agrHtml=Object.keys(agr).map(function(ax){var z=agr[ax];return '<div class="k">'+ax+'<b>'+(z[1]?Math.round(z[0]/z[1]*100)+"%":"—")+'</b><span class="muted">與過往四碼一致率</span></div>'}).join("");
 var axes=["EI","SN","TF","JP"],alphaHtml="",itemRows="";
 axes.forEach(function(ax){
  var items=META.filter(function(m){return m.axis===ax}), mat=data.map(function(d){return items.map(function(m){var a=d.answer_string[m.n-1];var side=a==="A"?m.a_side:m.b_side;return side===ax[0]?1:0})});
  var al=alpha(mat); alphaHtml+='<div class="k">'+ax+'<b>'+(al==null?"—":al.toFixed(2))+'</b><span class="muted">Cronbach α</span></div>';
  items.forEach(function(m,ii){var A=data.map(function(d){return d.answer_string[m.n-1]==="A"?1:0}), ar=mean(A), item=mat.map(function(r){return r[ii]}), rest=mat.map(function(r){return r.reduce(function(s,x,j){return s+(j===ii?0:x)},0)}), ir=corr(item,rest), flags=[];if(ar>.8||ar<.2)flags.push("A/B 過度偏斜");if(ir!=null&&ir<.15)flags.push("低題目-總分關聯");itemRows+='<tr><td>'+m.n+'</td><td>'+m.axis+'</td><td>'+esc(m.stem)+'</td><td>'+Math.round(ar*100)+'%</td><td>'+(ir==null?"—":ir.toFixed(2))+'</td><td class="'+(flags.length?"warn":"good")+'">'+(flags.length?flags.join("；"):"暫無紅燈")+'</td></tr>'})
 });
 var typeText=Object.keys(types).sort(function(a,b){return types[b]-types[a]}).map(function(t){return t+" "+types[t]}).join("、");
 var versionText=Object.keys(versions).map(function(v){return v+"："+versions[v]}).join("、");
 var versionWarn=Object.keys(versions).length>1?'<div class="box warn"><b>注意：</b>目前資料包含多個測驗版本。若不同版本有題目或計分規則變更，不建議直接合併做題目層級比較。</div>':'';
 document.getElementById("out").innerHTML='<h2>樣本摘要</h2><div class="cards"><div class="k">有效樣本<b>'+data.length+'</b></div><div class="k">作答時間中位數<b>'+(times.length?Math.round(median(times)/60*10)/10+" 分":"—")+'</b></div><div class="k">不同參考型<b>'+Object.keys(types).length+'</b></div><div class="k">核心題<b>68</b></div></div><div class="box"><b>參考四碼分布：</b>'+esc(typeText)+'</div><div class="box"><b>版本分布：</b>'+esc(versionText)+'</div>'+versionWarn<h2>內部一致性</h2><div class="cards">'+alphaHtml+'</div><h2>與過往穩定四碼的交叉驗證</h2><div class="cards">'+agrHtml+'</div><p class="muted">目前有 '+val.length+' 份資料包含選填的過往四碼。這只是收斂效度的初步參考，不代表官方 MBTI® 的等同性。</p><p class="muted">α 只能作為初步內部一致性指標，不等於效度。樣本太少時數字會很不穩；建議至少累積 30 份再開始觀察，100+ 再做較認真的修題判斷。</p><h2>逐題篩檢</h2><div class="tablewrap"><table><thead><tr><th>題號</th><th>軸</th><th>題幹</th><th>A比例</th><th>題目-其餘總分相關</th><th>旗標</th></tr></thead><tbody>'+itemRows+'</tbody></table></div>';
}
