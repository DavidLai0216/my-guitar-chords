<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人格測驗研究資料分析器</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;background:#f5f6fa;color:#1d2430;margin:0}.w{max-width:980px;margin:auto;padding:24px 14px 50px}.c{background:#fff;border:1px solid #e3e6eb;border-radius:18px;padding:24px}.box{background:#f7f8fc;border-radius:12px;padding:14px 16px;margin:12px 0}.btn{background:#4454b8;color:#fff;border:0;border-radius:12px;padding:13px 18px;font-weight:800}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.k{background:#f7f8fc;border-radius:12px;padding:14px}.k b{font-size:24px;display:block}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;border-bottom:1px solid #e7e9ee;padding:9px 7px;vertical-align:top}.warn{color:#9b4c00;font-weight:800}.good{color:#286b35;font-weight:700}a{color:#4454b8}@media(max-width:650px){.cards{grid-template-columns:1fr 1fr}.tablewrap{overflow:auto}table{min-width:760px}}</style></head><body><main class="w"><section class="c"><a href="./">← 回測驗</a><h1>匿名研究資料分析器</h1><p>Beta 1.7 起題目已改為跨人生階段中性版。請勿把 Beta 1.6 與 Beta 1.7 的題目層級資料直接合併分析。</p><input id="files" type="file" accept=".json,application/json" multiple><button class="btn" id="run">開始分析</button><div id="out"></div></section></main><script>
var AXES=["EI","SN","TF","JP"];var SIDE={EI:["E","I"],SN:["S","N"],TF:["T","F"],JP:["J","P"]};
var META=["EI","SN","TF","JP","TF","JP","EI","SN","SN","EI","JP","TF","JP","TF","SN","EI","EI","SN","TF","JP","JP","TF","EI","SN","SN","EI","JP","TF","JP","TF","SN","EI","EI","SN","TF","JP","JP","TF","SN","EI","EI","SN","TF","JP","JP","TF","SN","EI","EI","SN","TF","JP","JP","TF","SN","EI","EI","SN","TF","JP","JP","TF","SN","EI","EI","SN","TF","JP"];
var ASIDE=["E","S","T","J","F","P","I","N","S","E","J","T","P","F","N","I","E","S","T","J","P","F","I","N","S","E","J","T","P","F","N","I","E","S","T","J","P","F","N","I","E","S","T","J","P","F","N","I","E","S","T","J","P","F","N","I","E","S","T","J","P","F","N","I","E","S","T","J"];
var STEM=["參加陌生聚會","學全新概念","團隊成員犯錯","旅行前規劃","方案利弊","截止日","多人討論新點子","複雜說明","新資料","恢復精神","臨時取消安排","朋友遇到棘手問題","桌面或數位檔案","負面回饋","新系統","遇到不太熟的人","認識新團體","閱讀文章","規則與個案","多件事","聚餐安排","重大決策","開心的事","陌生地方","討論問題","長時間社交","未決事情","爭議議題","完成任務","合作的人表現不如預期","學新知識","自我介紹","沒有熟人互動","回想多人討論","合作人選","自由的一天","買重要物品","朋友問對不對","反覆現象","新問題","多人聊天","案例","團體意見分裂","多人討論事情","新機會","好的帶領者","複雜主題","大量互動","旅行陌生人","描述事情","高效率但不舒服方案","待辦事項","資訊足夠仍要決定","被挑戰看法","資訊很多的內容","慶祝成果","公開提問","新產品或新工具","做選擇","活動開始前","臨時改安排","處理衝突","抽象說明","認識新朋友","學習或做事環境","陌生領域","整體效率與少數影響","做事狀態"];
function mean(a){return a.reduce(function(s,x){return s+x},0)/a.length}function variance(a){if(a.length<2)return 0;var m=mean(a);return a.reduce(function(s,x){return s+(x-m)*(x-m)},0)/(a.length-1)}function corr(x,y){if(x.length<3)return null;var mx=mean(x),my=mean(y),sx=0,sy=0,sxy=0;for(var i=0;i<x.length;i++){var dx=x[i]-mx,dy=y[i]-my;sx+=dx*dx;sy+=dy*dy;sxy+=dx*dy}return sx&&sy?sxy/Math.sqrt(sx*sy):null}function alpha(rows){if(rows.length<3)return null;var k=rows[0].length,cols=[];for(var j=0;j<k;j++)cols.push(rows.map(function(r){return r[j]}));var totals=rows.map(function(r){return r.reduce(function(s,x){return s+x},0)}),vt=variance(totals);if(!vt)return null;return k/(k-1)*(1-cols.reduce(function(s,c){return s+variance(c)},0)/vt)}function read(f){return new Promise(function(ok,no){var r=new FileReader();r.onload=function(){try{ok(JSON.parse(r.result))}catch(e){no(e)}};r.onerror=no;r.readAsText(f)})}
document.getElementById("run").onclick=async function(){var fs=[].slice.call(document.getElementById("files").files),data=[];for(var i=0;i<fs.length;i++){try{var d=await read(fs[i]);if(d.answer_string&&d.answer_string.length>=68)data.push(d)}catch(e){}}if(!data.length){out.innerHTML='<div class="box">沒有有效資料。</div>';return}var vers={};data.forEach(function(d){var v=d.test_version||"未知";vers[v]=(vers[v]||0)+1});var vkeys=Object.keys(vers),warning=vkeys.length>1?'<div class="box warn">包含多個測驗版本：'+vkeys.map(function(v){return v+' '+vers[v]}).join('、')+'。Beta 1.7 更改了題目文字，請分版本做題目層級分析。</div>':'';var alphaCards='',rows='';AXES.forEach(function(ax){var idx=[];META.forEach(function(a,i){if(a===ax)idx.push(i)});var left=SIDE[ax][0],mat=data.map(function(d){return idx.map(function(i){var chosen=d.answer_string[i]==="A"?ASIDE[i]:(ASIDE[i]===SIDE[ax][0]?SIDE[ax][1]:SIDE[ax][0]);return chosen===left?1:0})});var al=alpha(mat);alphaCards+='<div class="k">'+ax+'<b>'+(al==null?'—':al.toFixed(2))+'</b>α</div>';idx.forEach(function(ii,pos){var A=data.map(function(d){return d.answer_string[ii]==="A"?1:0}),item=mat.map(function(r){return r[pos]}),rest=mat.map(function(r){return r.reduce(function(s,x,j){return s+(j===pos?0:x)},0)}),ir=corr(item,rest),ap=mean(A),flags=[];if(ap<.2||ap>.8)flags.push('A/B 過度偏斜');if(ir!=null&&ir<.15)flags.push('低題目－總分關聯');rows+='<tr><td>'+(ii+1)+'</td><td>'+ax+'</td><td>'+STEM[ii]+'</td><td>'+Math.round(ap*100)+'%</td><td>'+(ir==null?'—':ir.toFixed(2))+'</td><td class="'+(flags.length?'warn':'good')+'">'+(flags.length?flags.join('；'):'暫無紅燈')+'</td></tr>'})});out.innerHTML=warning+'<h2>有效樣本：'+data.length+'</h2><div class="cards">'+alphaCards+'</div><p>α 只代表初步內部一致性，不等於效度。Beta 1.7 建議重新累積樣本，不把舊版題目資料直接當成同一量表。</p><div class="tablewrap"><table><thead><tr><th>題號</th><th>軸</th><th>題目摘要</th><th>A比例</th><th>題目－其餘總分相關</th><th>旗標</th></tr></thead><tbody>'+rows+'</tbody></table></div>'}
</script></body></html>
