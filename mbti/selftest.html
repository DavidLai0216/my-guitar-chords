<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>自動 QA 測試</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;background:#f5f6fa;margin:0;color:#1e2631}.w{max-width:860px;margin:auto;padding:24px 14px 50px}.c{background:#fff;border:1px solid #e3e6eb;border-radius:18px;padding:24px}.pass{color:#24703b;font-weight:800}.fail{color:#b3261e;font-weight:800}.box{background:#f7f8fc;padding:14px 16px;border-radius:12px;margin:10px 0;line-height:1.65}a{color:#4454b8}</style></head><body><main class="w"><section class="c"><a href="qa.html">← 回 QA</a><h1>自動 QA 測試</h1><p>這個頁面只檢查程式與計分規則是否自洽，不是心理效度驗證。</p><div id="out"></div></section></main>
<script>
var Q=[["參加一個幾乎都不認識人的聚會時，你通常會","主動找人聊幾句，邊互動邊熟悉環境","先觀察一陣子，找到適合的人再開始聊","E","I","EI"],["學一個全新的概念時，你比較容易進入狀況的方式是","先看幾個具體案例，再整理出共同原則","先理解整體架構，再把案例放進架構裡","S","N","SN"],["團隊成員犯錯時，你比較自然的第一反應是","先釐清原因、責任與改善方法","先理解當事人的處境與感受","T","F","TF"],["出發旅行前，你比較喜歡","主要行程和住宿先確定好","只抓大方向，到當地再決定","J","P","JP"],["兩個方案各有利弊時，你比較依賴","哪個方案更符合大家重視的價值","一致的標準與邏輯比較","F","T","TF"],["面對一個月後的截止日，你通常","先保留彈性，接近期限再集中完成","會提早拆成幾個階段開始做","P","J","JP"],["開會討論新點子時，你比較自然的是","先在腦中整理好，再把想法說出來","邊說邊整理自己的想法","I","E","EI"],["聽完一段複雜說明後，你通常比較容易記住","整體想表達的模式與關係","具體發生了哪些事情與細節","N","S","SN"],["看到一組新資料時，你通常先做的是","確認每個數字或資訊本身代表什麼","尋找這些資訊之間可能存在的規律","S","N","SN"],["忙了一整天後，你比較能恢復精神的方式是","找熟人聊聊或一起做點事","留一段自己的時間，安靜放空","E","I","EI"],["臨時取消原本的安排時，你通常","需要一點時間重新調整節奏","很快就能接受，甚至覺得多了新選擇","J","P","JP"],["朋友遇到工作問題向你訴苦時，你通常先","一起拆解問題、找出解法","先讓他把感受說完並表示理解","T","F","TF"],["工作桌或數位檔案比較亂時，你通常","只要找得到需要的東西就可以","會想找時間整理到有秩序","P","J","JP"],["需要給別人負面回饋時，你更在意","對方能不能在被尊重的情況下聽進去","內容是否精準、問題是否說清楚","F","T","TF"],["別人教你操作一套新系統時，你比較喜歡","先知道整套系統怎麼運作，再進入操作","照實際步驟做一次，很快就能掌握","N","S","SN"],["搭電梯遇到不熟的同事時，你通常","除非對方先開口，否則多半安靜","很容易自然開個話題","I","E","EI"],["要認識一個新團隊，你比較傾向","先跟多數人都聊過一輪","先和少數幾個人建立較深的連結","E","I","EI"],["閱讀一篇文章時，你比較自然會注意","作者明確寫出的內容與例子","內容背後隱含的主旨與延伸含義","S","N","SN"],["遇到規則與特殊個案衝突時，你比較傾向","先維持一致標準，再談例外","先看個別情況，再決定是否調整標準","T","F","TF"],["同時有幾件事要做時，你比較喜歡","先排出先後順序，一件件完成","依當下狀況在幾件事之間切換","J","P","JP"],["朋友約聚餐時，你比較喜歡","接近日期再看大家狀況決定","早一點把時間地點定下來","P","J","JP"],["做重大決策時，你比較擔心","決定是否傷害重要的人或關係","判斷是否前後一致、有沒有邏輯漏洞","F","T","TF"],["當你有一件很開心的事時，你通常","會先自己感受一陣子，再決定要不要說","很快就想找人分享","I","E","EI"],["第一次到一個陌生地方，你比較容易留下印象的是","這個地方給你的整體特色與氛圍脈絡","看到的街道、店家、人物與具體景象","N","S","SN"],["討論一個問題時，你比較常從哪裡開始","目前已知、可以確認的資訊","不同資訊之間可能存在的關聯","S","N","SN"],["一段長時間的社交活動結束後，你通常","還有興致續攤或繼續聊天","會想回到比較安靜、少人的環境","E","I","EI"],["遇到還沒決定的事情，你通常","希望盡快收斂選項、做出決定","願意多保留一些可能性","J","P","JP"],["討論爭議議題時，你比較容易","把人和觀點分開，直接檢驗論點","把觀點放在人的背景與立場中理解","T","F","TF"],["完成一項任務後，你比較有滿足感的是","過程中出現新的變化與發現","事情正式結案、可以劃掉","P","J","JP"],["看到同事表現不佳時，你比較傾向","先了解是否有個人或情境因素","明確指出差距與改善要求","F","T","TF"],["學習一項新知識時，你比較容易理解","有模型、架構或概念關係的內容","有明確例子、步驟或實際示範的內容","N","S","SN"],["遇到陌生場合需要自我介紹時，你通常","事前想一下要怎麼說會比較自在","臨場說也能很自然","I","E","EI"],["一段時間都沒有和熟人互動時，你通常會","開始想找人聊聊或一起做點事","覺得有自己的空間其實很舒服","E","I","EI"],["回想一場會議，你比較容易記得","誰說了什麼、做了哪些具體決定","整場討論形成了什麼方向與脈絡","S","N","SN"],["評估合作人選時，你比較自然先看","做事方式是否合邏輯、分工是否有效","彼此價值是否契合、互動是否有信任感","T","F","TF"],["如果一天完全自由，你比較可能","先想好今天大概要做哪些事","看當下心情再決定做什麼","J","P","JP"],["買重要物品前，你通常","持續看看，直到遇到讓自己想下手的選項","設定條件，比較後做決定","P","J","JP"],["朋友問你『這樣做對不對』時，你較常","考慮這件事對相關人的影響","分析利弊與原則","F","T","TF"],["看到一個現象反覆出現時，你通常會先","思考背後是否有一個共同模式可以解釋","確認每次實際發生的條件是否相同","N","S","SN"],["面對一個新問題時，你較常","先自己想出一個方向，再找人討論","找人討論，從對話中形成想法","I","E","EI"],["在多人聊天場合，你通常","容易接話，也會主動帶出新話題","比較常聽，遇到有興趣的話題才加入","E","I","EI"],["別人講一個案例時，你比較容易追問","當時實際發生的細節是什麼","這個案例可以說明什麼更大的問題","S","N","SN"],["當團隊意見分裂時，你較容易主張","用共同標準把方案攤開比較","先找出大家真正重視的需求","T","F","TF"],["開會時你比較喜歡","有議程、目標與結論","讓討論自然延伸，也接受臨時轉向","J","P","JP"],["計畫進行到一半出現新機會時，你較傾向","願意調整原計畫，把新機會放進來","先完成原計畫，再評估新機會","P","J","JP"],["你認為好的主管更應該","理解人、知道不同成員需要什麼","判斷清楚、賞罰有一致原則","F","T","TF"],["在理解一個複雜主題時，你比較依賴","先抓住核心概念，再補進必要細節","具體資訊累積起來的完整圖像","N","S","SN"],["連續幾天都需要大量與人互動時，你通常","會希望有一段不被打擾的時間恢復精神","會逐漸進入狀況，互動本身能帶來動能","I","E","EI"],["旅行途中和陌生人坐在一起，你通常","不排斥主動聊幾句","多半專心做自己的事","E","I","EI"],["你在描述一件事情時，通常較自然的是","按照事件實際發生的順序說","先講整體重點，再視需要補充細節","S","N","SN"],["面對一個效率高但讓部分人不舒服的方案，你較可能","先確認成果是否值得付出代價","先尋找降低人際衝擊的替代方式","T","F","TF"],["面對很多待辦事項時，你比較安心的是","把它們列出來並逐項完成","知道大概有哪些事，再彈性處理","J","P","JP"],["做決定前，如果資訊已經足夠，你較常","還會想再保留一下，看是否有更好的選項","做出選擇並往下執行","P","J","JP"],["別人挑戰你的看法時，你更希望他","先理解你的出發點再提出不同意見","直接指出哪裡不合理","F","T","TF"],["面對一份資訊很多的報告，你通常先抓","這些資訊共同指向的趨勢或意義","有哪些關鍵數據與明確事實","N","S","SN"],["遇到值得慶祝的成果，你第一個念頭比較可能是","先自己享受達成目標的滿足","找人一起慶祝","I","E","EI"],["在課程或演講的 Q&A 時間，你比較可能","想到問題就直接舉手問","先評估問題是否值得公開提出","E","I","EI"],["看到一個新產品時，你比較容易先注意","它目前有哪些功能、規格與使用方式","它背後的概念，以及未來可能如何延伸","S","N","SN"],["做選擇時，你比較常問自己","哪一個比較合理？","哪一個比較符合我在乎的價值？","T","F","TF"],["活動開始前，你比較喜歡","流程與分工先確認清楚","保留空間，現場再視情況調整","J","P","JP"],["如果原本預定下午做 A，突然有人邀你做 B，你通常","很容易因為 B 更有趣而改變安排","先看 A 能不能照計畫完成","P","J","JP"],["處理衝突時，你比較容易先做的是","讓彼此把立場和感受說出來","界定問題、事實與責任","F","T","TF"],["當一段說明很抽象時，你通常會希望","先把抽象概念之間的關係講清楚","有人舉一個具體例子讓你確認意思","N","S","SN"],["認識新朋友時，你通常","需要一些時間才會真正放開","很快就能讓話題延伸開來","I","E","EI"],["如果工作可以自由選擇環境，你較偏好","有互動、隨時可以交換想法的地方","能專心、不容易被打斷的地方","E","I","EI"],["當你需要理解陌生產業時，你比較自然會","先蒐集實際產品、客戶、流程等具體資訊","先畫出產業角色、關係與運作架構","S","N","SN"],["如果一項決定對整體最有效率、但少數人會受影響，你較傾向","依整體效益做決定，再設法補救","先重新找兼顧受影響者的方案","T","F","TF"],["你比較喜歡哪種工作狀態","事情有明確節點，完成一件再開下一件","可以同時探索幾個方向，最後再收斂","J","P","JP"]],CAL={"EI":[["有人一起討論時，你通常更容易形成想法","自己安靜思考時，你通常更容易形成想法","E","I"],["一整天與很多人互動後，你通常需要獨處恢復","一整天與很多人互動後，你通常仍有精神","I","E"],["進入陌生團體時，你通常會主動建立多個連結","進入陌生團體時，你通常先建立少數連結","E","I"],["碰到有趣的事情，你通常會先留在自己心裡消化","碰到有趣的事情，你通常很快想找人分享","I","E"],["討論問題時，說出來會幫助你想清楚","討論問題前，先想清楚會讓你更容易表達","E","I"]],"SN":[["接觸新主題時，案例會幫助你理解概念","接觸新主題時，架構會幫助你理解案例","S","N"],["你比較容易先形成整體假設，再看事件是否符合","你比較容易從多個具體事件歸納共同點","N","S"],["資訊很多時，你先注意明確細節","資訊很多時，你先注意資訊之間的關係","S","N"],["回想一段內容時，你較容易記住核心概念","回想一段內容時，你較容易記住具體描述","N","S"],["理解陌生問題時，你較想先知道實際狀況","理解陌生問題時，你較想先知道整體模型","S","N"]],"TF":[["遇到爭議時，你通常先檢查論點是否一致","遇到爭議時，你通常先理解各方重視什麼","T","F"],["給建議時，你比較自然先回應對方感受","給建議時，你比較自然先分析問題","F","T"],["做決定時，一致標準對你較重要","做決定時，個別處境對你較重要","T","F"],["你較能接受兼顧感受與關係的回饋","你較能接受直接但精準的回饋","F","T"],["意見不同時，你先處理事情本身","意見不同時，你先處理彼此的理解","T","F"]],"JP":[["事情早點定案會讓你比較安心","選項保持開放會讓你比較自在","J","P"],["你喜歡先開始，再依進展調整步驟","你喜歡先排好主要步驟再開始","P","J"],["行程確定後你比較容易安排其他事","行程保留彈性你比較容易因應變化","J","P"],["你比較能同時讓幾件事保持進行","你比較喜歡先完成再開下一件事","P","J"],["期限還早時，你也傾向提早推進","期限還早時，你傾向先保留空間","J","P"]]};
function wilson(k,n){var z=1.645,p=k/n,den=1+z*z/n,center=(p+z*z/(2*n))/den,half=z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n))/den;return [center-half,center+half]}
function strong(a,b,n){return wilson(Math.max(a,b),n)[0]>.5}
var tests=[];
function t(name,ok,detail){tests.push({name:name,ok:!!ok,detail:detail||""})}
var axes=["EI","SN","TF","JP"];
axes.forEach(function(ax){
 var arr=Q.filter(function(x){return x[5]===ax});
 t(ax+" 題數 = 17",arr.length===17,"實際 "+arr.length);
 var left={};arr.forEach(function(x){left[x[3]]=(left[x[3]]||0)+1});
 var vals=Object.keys(left).map(function(k){return left[k]}).sort();
 t(ax+" A/B 方向平衡 8:9",vals.length===2&&vals[0]===8&&vals[1]===9,JSON.stringify(left));
});
t("17題 11:6 應為不明確",!strong(11,6,17));
t("17題 12:5 應為明確",strong(12,5,17));
t("22題 14:8 應為不明確",!strong(14,8,22));
t("22題 15:7 應為明確",strong(15,7,22));
axes.forEach(function(ax){
 t(ax+" 有 5 題校準題",CAL[ax]&&CAL[ax].length===5,CAL[ax]?CAL[ax].length:0);
});
function normalizeProgress(s){
 if(!s||!Array.isArray(s.a)||!Array.isArray(s.cq)||!Array.isArray(s.ca))return null;
 if(s.phase==="core"&&s.i>=68){
   if(s.cq.length){s.phase="cal";s.i=Math.min(s.ca.length,s.cq.length)}
   else return null;
 }
 if(s.phase==="cal"&&s.cq.length===0)return null;
 if(s.phase==="cal"&&s.i>s.cq.length)s.i=s.cq.length;
 return s;
}
var stale={phase:"core",i:68,a:new Array(68).fill("a"),cq:[],ca:[],started:1};
t("續答邊界狀態：舊 core=68 且無校準題應捨棄",normalizeProgress(stale)===null);
var recover={phase:"core",i:68,a:new Array(68).fill("a"),cq:[["a","b","E","I","EI"]],ca:[],started:1};
var rr=normalizeProgress(recover);
t("續答邊界狀態：已有校準題應轉回 cal",rr&&rr.phase==="cal"&&rr.i===0);
var allA={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
Q.forEach(function(x){allA[x[3]]++});
t("全選 A 不應導致四軸全部同一人格側",!(allA.E===17&&allA.S===17&&allA.T===17&&allA.J===17),JSON.stringify(allA));
var html='<h2>結果</h2>';var pass=0;
tests.forEach(function(x){if(x.ok)pass++;html+='<div class="box"><span class="'+(x.ok?'pass':'fail')+'">'+(x.ok?'PASS':'FAIL')+'</span>　'+x.name+(x.detail?'<br><small>'+x.detail+'</small>':'')+'</div>'});
html='<div class="box"><b>'+pass+' / '+tests.length+' 通過</b></div>'+html;
document.getElementById("out").innerHTML=html;
</script></body></html>
