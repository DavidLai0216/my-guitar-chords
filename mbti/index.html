<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>四向度人格偏好測驗</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--text:#1d2430;--muted:#6e7682;--line:#e2e5eb;--accent:#4454b8;--soft:#eef0ff}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Segoe UI",sans-serif}
.wrap{max-width:720px;margin:auto;padding:16px 12px 48px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 10px 28px rgba(20,30,60,.06)}
h1{font-size:30px;line-height:1.22;margin:4px 0 12px}.eyebrow{font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--accent);margin-bottom:8px}
p{font-size:16px;line-height:1.75}.muted{color:var(--muted)}
.primary,.choice{width:100%;font:inherit;border-radius:15px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.primary{border:0;background:var(--accent);color:#fff;padding:16px;font-weight:800;font-size:17px;margin-top:12px}
.choice{border:1.5px solid var(--line);background:#fff;padding:18px;text-align:left;font-weight:700;line-height:1.55;font-size:16px}.choice:active{background:var(--soft);border-color:var(--accent)}
.choices{display:grid;gap:12px}.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}.progress{height:9px;background:#edf0f4;border-radius:99px;overflow:hidden;flex:1}.bar{height:100%;background:var(--accent)}.count{font-size:13px;color:var(--muted);min-width:54px;text-align:right}
.q{font-size:22px;font-weight:800;line-height:1.5;margin:18px 0}.back{border:0;background:transparent;color:var(--muted);padding:18px 0 0;font-size:15px}
.note{margin-top:18px;background:#f7f8fc;border-radius:14px;padding:15px;line-height:1.65;color:#58606b}.small{font-size:13px}
.result{font-size:56px;font-weight:900;letter-spacing:.05em;margin:4px 0 6px}.axis{margin:20px 0}.axishead{display:flex;justify-content:space-between;font-weight:800;font-size:14px;margin-bottom:7px}.track{height:15px;background:#e9ecf2;border-radius:99px;overflow:hidden;display:flex}.l{height:100%;background:#4454b8}.r{height:100%;background:#bbc1ea}.conf{font-size:13px;color:var(--muted);margin-top:6px}
@media(min-width:700px){.wrap{padding-top:30px}.card{padding:30px}.q{font-size:24px}}
</style>
</head>

var Q=[["參加一個幾乎都不認識人的聚會時，你通常會","主動找人聊幾句，邊互動邊熟悉環境","先觀察一陣子，找到適合的人再開始聊","E","I","EI"],["學一個全新的工具時，你比較希望先看到","實際操作步驟和範例","整體原理和它還能延伸出什麼","S","N","SN"],["團隊成員犯錯時，你比較自然的第一反應是","先釐清原因、責任與改善方法","先理解當事人的處境與感受","T","F","TF"],["出發旅行前，你比較喜歡","主要行程和住宿先確定好","只抓大方向，到當地再決定","J","P","JP"],["兩個方案各有利弊時，你比較依賴","一致的標準與邏輯比較","哪個方案更符合大家重視的價值","T","F","TF"],["面對一個月後的截止日，你通常","會提早拆成幾個階段開始做","先保留彈性，接近期限再集中完成","J","P","JP"],["開會討論新點子時，你比較自然的是","邊說邊整理自己的想法","先在腦中整理好，再把想法說出來","E","I","EI"],["別人說明一個計畫時，你比較容易注意","具體怎麼做、何時做、誰來做","背後的方向、可能性與長期影響","S","N","SN"],["回想一次旅行，你較容易記得","去過哪些地方、吃過什麼、發生哪些事","整趟旅程帶給你的感覺與聯想","S","N","SN"],["忙了一整天後，你比較能恢復精神的方式是","找熟人聊聊或一起做點事","留一段自己的時間，安靜放空","E","I","EI"],["臨時取消原本的安排時，你通常","需要一點時間重新調整節奏","很快就能接受，甚至覺得多了新選擇","J","P","JP"],["朋友遇到工作問題向你訴苦時，你通常先","一起拆解問題、找出解法","先讓他把感受說完並表示理解","T","F","TF"],["工作桌或數位檔案比較亂時，你通常","會想找時間整理到有秩序","只要找得到需要的東西就可以","J","P","JP"],["需要給別人負面回饋時，你更在意","內容是否精準、問題是否說清楚","對方能不能在被尊重的情況下聽進去","T","F","TF"],["面對一項成熟流程，你比較自然會想","先照有效的方法做穩","思考是否能換一種完全不同的方法","S","N","SN"],["搭電梯遇到不熟的同事時，你通常","很容易自然開個話題","除非對方先開口，否則多半安靜","E","I","EI"],["要認識一個新團隊，你比較傾向","先跟多數人都聊過一輪","先和少數幾個人建立較深的連結","E","I","EI"],["聽到一個新概念時，你第一個問題較可能是","實際上要怎麼用？","它還可能代表什麼？","S","N","SN"],["遇到規則與特殊個案衝突時，你比較傾向","先維持一致標準，再談例外","先看個別情況，再決定是否調整標準","T","F","TF"],["同時有幾件事要做時，你比較喜歡","先排出先後順序，一件件完成","依當下狀況在幾件事之間切換","J","P","JP"],["朋友約聚餐時，你比較喜歡","早一點把時間地點定下來","接近日期再看大家狀況決定","J","P","JP"],["做重大決策時，你比較擔心","判斷是否前後一致、有沒有邏輯漏洞","決定是否傷害重要的人或關係","T","F","TF"],["當你有一件很開心的事時，你通常","很快就想找人分享","會先自己感受一陣子，再決定要不要說","E","I","EI"],["閱讀文章時，你比較喜歡","意思清楚、例子具體","留有想像空間、可以延伸解讀","S","N","SN"],["規劃新產品時，你比較容易先看到","目前客戶真正提出的需求","未來可能出現、但尚未明說的需求","S","N","SN"],["一段長時間的社交活動結束後，你通常","還有興致續攤或繼續聊天","會想回到比較安靜、少人的環境","E","I","EI"],["遇到還沒決定的事情，你通常","希望盡快收斂選項、做出決定","願意多保留一些可能性","J","P","JP"],["討論爭議議題時，你比較容易","把人和觀點分開，直接檢驗論點","把觀點放在人的背景與立場中理解","T","F","TF"],["完成一項任務後，你比較有滿足感的是","事情正式結案、可以劃掉","過程中出現新的變化與發現","J","P","JP"],["看到同事表現不佳時，你比較傾向","明確指出差距與改善要求","先了解是否有個人或情境因素","T","F","TF"],["遇到資訊不足的問題時，你通常","先找更多已知事實","先形成幾個可能的假設再驗證","S","N","SN"],["遇到陌生場合需要自我介紹時，你通常","臨場說也能很自然","事前想一下要怎麼說會比較自在","E","I","EI"],["週末完全沒有安排時，你較可能","臨時約人出去走走","享受自己安排、不被打擾的時間","E","I","EI"],["別人講故事時，你比較在意","事件有沒有說清楚、前後是否吻合","故事想傳達的意義或象徵","S","N","SN"],["選擇合作夥伴時，你較優先看重","能力、可靠度與成果","價值觀、信任感與相處方式","T","F","TF"],["如果一天完全自由，你比較可能","先想好今天大概要做哪些事","看當下心情再決定做什麼","J","P","JP"],["買重要物品前，你通常","設定條件，比較後做決定","持續看看，直到遇到讓自己想下手的選項","J","P","JP"],["朋友問你『這樣做對不對』時，你較常","分析利弊與原則","考慮這件事對相關人的影響","T","F","TF"],["看到一個設計作品，你較容易先注意","材質、比例、做工等具體細節","整體概念、風格與創意","S","N","SN"],["面對一個新問題時，你較常","找人討論，從對話中形成想法","先自己想出一個方向，再找人討論","E","I","EI"],["在多人聊天場合，你通常","容易接話，也會主動帶出新話題","比較常聽，遇到有興趣的話題才加入","E","I","EI"],["當別人教你一件事，你比較喜歡","一步一步示範","先講大方向，細節自己摸索","S","N","SN"],["當團隊意見分裂時，你較容易主張","用共同標準把方案攤開比較","先找出大家真正重視的需求","T","F","TF"],["開會時你比較喜歡","有議程、目標與結論","讓討論自然延伸，也接受臨時轉向","J","P","JP"],["計畫進行到一半出現新機會時，你較傾向","先完成原計畫，再評估新機會","願意調整原計畫，把新機會放進來","J","P","JP"],["你認為好的主管更應該","判斷清楚、賞罰有一致原則","理解人、知道不同成員需要什麼","T","F","TF"],["解決問題時，你較信任","曾經驗證有效的方法","新聯想到、值得嘗試的方法","S","N","SN"],["如果需要連續幾天與很多人密集互動，你通常","越互動越進入狀況","需要刻意安排獨處時間補充精神","E","I","EI"],["旅行途中和陌生人坐在一起，你通常","不排斥主動聊幾句","多半專心做自己的事","E","I","EI"],["你在描述一件事情時，通常比較會","按實際發生的過程說明","抓重點並加入自己的解讀","S","N","SN"],["面對一個效率高但讓部分人不舒服的方案，你較可能","先確認成果是否值得付出代價","先尋找降低人際衝擊的替代方式","T","F","TF"],["面對很多待辦事項時，你比較安心的是","把它們列出來並逐項完成","知道大概有哪些事，再彈性處理","J","P","JP"],["做決定前，如果資訊已經足夠，你較常","做出選擇並往下執行","還會想再保留一下，看是否有更好的選項","J","P","JP"],["別人挑戰你的看法時，你更希望他","直接指出哪裡不合理","先理解你的出發點再提出不同意見","T","F","TF"],["面對未來五年的規劃，你較容易思考","有哪些可預見、可落實的步驟","可能出現哪些新的方向與機會","S","N","SN"],["遇到值得慶祝的成果，你第一個念頭比較可能是","找人一起慶祝","先自己享受達成目標的滿足","E","I","EI"],["在課程或演講的 Q&A 時間，你比較可能","想到問題就直接舉手問","先評估問題是否值得公開提出","E","I","EI"],["參觀一個陌生地方時，你較常","留意眼前具體的人事物","一邊看一邊聯想到其他可能性","S","N","SN"],["做選擇時，你比較常問自己","哪一個比較合理？","哪一個比較符合我在乎的價值？","T","F","TF"],["活動開始前，你比較喜歡","流程與分工先確認清楚","保留空間，現場再視情況調整","J","P","JP"],["如果原本預定下午做 A，突然有人邀你做 B，你通常","先看 A 能不能照計畫完成","很容易因為 B 更有趣而改變安排","J","P","JP"],["處理衝突時，你比較容易先做的是","界定問題、事實與責任","讓彼此把立場和感受說出來","T","F","TF"],["選擇一本非小說類書籍時，你較容易被吸引的是","有具體方法、案例與可操作內容","提出新觀點、模型或顛覆性想法","S","N","SN"],["認識新朋友時，你通常","很快就能讓話題延伸開來","需要一些時間才會真正放開","E","I","EI"],["如果工作可以自由選擇環境，你較偏好","有互動、隨時可以交換想法的地方","能專心、不容易被打斷的地方","E","I","EI"],["當資料與直覺指向不同方向時，你通常先","回到可驗證的資料與事實","追查那個直覺背後是否有尚未看見的模式","S","N","SN"],["如果一項決定對整體最有效率、但少數人會受影響，你較傾向","依整體效益做決定，再設法補救","先重新找兼顧受影響者的方案","T","F","TF"],["你比較喜歡哪種工作狀態","事情有明確節點，完成一件再開下一件","可以同時探索幾個方向，最後再收斂","J","P","JP"]];
var CAL={"EI":[["先找人交換想法，從互動中釐清","先自己整理思緒，確定後再交換想法","E","I"],["有人一起參與會讓你更有精神","自己專心投入會讓你更有精神","E","I"]],"SN":[["先確認眼前已知的事實","先推想這些事實背後可能的趨勢","S","N"],["具體可行比新奇重要","新的可能性比沿用現況更吸引你","S","N"]],"TF":[["先用同一套標準判斷","先考慮不同人的處境","T","F"],["結論是否合理最重要","決定是否照顧重要價值最重要","T","F"]],"JP":[["先把事情定下來會比較安心","多留一些選項會比較自在","J","P"],["有清楚計畫比較容易進入狀況","保有彈性比較容易發揮","J","P"]]};
var DESC={"ISTJ":"重視事實、結構與可靠執行，通常偏好清楚標準與可預期的節奏。","ISFJ":"重視實際需求與人際照顧，常以穩定、細緻的方式支持團隊。","INFJ":"傾向從長期意義與人的需要出發，重視一致的價值與方向。","INTJ":"喜歡建立模型與長期策略，傾向獨立思考並把想法系統化。","ISTP":"偏好直接理解問題運作方式，善於在現場以務實方式排除障礙。","ISFP":"重視真實感受與個人價值，通常彈性高，也敏銳於當下環境。","INFP":"重視內在價值與可能性，常從理想、意義與人的獨特性思考。","INTP":"喜歡拆解概念與邏輯，對模型、原理與新假設特別有興趣。","ESTP":"行動快、重視現場資訊，通常喜歡直接嘗試並即時調整。","ESFP":"重視互動與當下體驗，通常能快速感受環境與他人的反應。","ENFP":"容易從人與點子中看到新可能，喜歡探索並連結不同想法。","ENTP":"喜歡挑戰既有假設、探索替代方案，常透過討論發展新觀點。","ESTJ":"重視效率、秩序與執行，通常善於把目標轉成明確行動。","ESFJ":"重視合作、責任與群體需要，常主動維持團隊運作與關係。","ENFJ":"重視人的成長與共同方向，常能整合觀點並推動合作。","ENTJ":"偏好明確目標、策略與決策，常把複雜問題整理成可執行架構。"};
var app=document.getElementById("app");
var st={phase:"intro",i:0,a:[],cq:[],ca:[]};
var lab={EI:["E 外向","I 內向"],SN:["S 實感","N 直覺"],TF:["T 思考","F 情感"],JP:["J 判斷","P 感知"]};
function esc(s){return String(s).replace(/[&<>"]/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]})}
function intro(){app.innerHTML='<section class="card"><div class="eyebrow">70 題 · 約 6–9 分鐘</div><h1>四向度人格偏好測驗</h1><p>用日常情境觀察你在 <b>E/I、S/N、T/F、J/P</b> 四個向度上的自然偏好。</p><p class="muted">前 68 題為核心題；第 69–70 題會自動針對最接近中線的兩個向度校準。請選「比較像平常的你」，不是「理想中的你」。</p><button class="primary" id="start">開始測驗</button><div class="note small">本測驗為自製的四向度人格偏好工具，並非 The Myers-Briggs Company 的官方 MBTI® 評量；適合自我探索，不宜作為人事甄選、醫療或心理診斷依據。</div></section>';document.getElementById("start").onclick=function(){st={phase:"core",i:0,a:[],cq:[],ca:[]};render()}}
function render(){var c=st.phase==="cal",n=c?68+st.i:st.i,x=c?st.cq[st.i]:Q[st.i];app.innerHTML='<section class="card"><div class="top"><div class="progress"><div class="bar" style="width:'+(n/70*100)+'%"></div></div><div class="count">'+(n+1)+' / 70</div></div><div class="eyebrow">'+(c?"校準題":"情境題")+'</div><div class="q">'+esc(c?"最後兩題：哪一個描述更接近平常的你？":x[0])+'</div><div class="choices"><button class="choice" id="a">A　'+esc(c?x[0]:x[1])+'</button><button class="choice" id="b">B　'+esc(c?x[1]:x[2])+'</button></div>'+(n?'<button class="back" id="back">← 上一題</button>':'')+'</section>';document.getElementById("a").onclick=function(){ans("a")};document.getElementById("b").onclick=function(){ans("b")};var b=document.getElementById("back");if(b)b.onclick=back;window.scrollTo(0,0)}
function ans(k){if(st.phase==="core"){st.a[st.i]=k;st.i++;if(st.i===68)prep();else render()}else{st.ca[st.i]=k;st.i++;if(st.i===2)result();else render()}}
function back(){if(st.phase==="core"){if(st.i){st.i--;render()}}else{if(st.i){st.i--;render()}else{st.phase="core";st.i=67;render()}}}
function raw(){var s={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};for(var i=0;i<Q.length;i++){var x=Q[i],k=st.a[i];if(k)s[k==="a"?x[3]:x[4]]++}return s}
function prep(){var s=raw(),m=[["EI",Math.abs(s.E-s.I)],["SN",Math.abs(s.S-s.N)],["TF",Math.abs(s.T-s.F)],["JP",Math.abs(s.J-s.P)]];m.sort(function(a,b){return a[1]-b[1]});st.cq=[];for(var i=0;i<2;i++){var ax=m[i][0],z=CAL[ax][i%2];st.cq.push([z[0],z[1],z[2],z[3],ax])}st.phase="cal";st.i=0;render()}
function finalScore(){var s=raw();for(var i=0;i<st.cq.length;i++){var x=st.cq[i],k=st.ca[i];if(k)s[k==="a"?x[2]:x[3]]+=.5}return s}
function cf(d){return d<=1.5?"接近中線":d<=4.5?"中度傾向":"明顯傾向"}
function result(){var s=finalScore(),defs=[["EI","E","I"],["SN","S","N"],["TF","T","F"],["JP","J","P"]],type="",rows="",near=[];for(var i=0;i<defs.length;i++){var d=defs[i],ax=d[0],l=d[1],r=d[2],lv=s[l],rv=s[r],sum=lv+rv,lp=Math.round(lv/sum*100),rp=100-lp,ch=lv>rv?l:r;type+=ch;if(Math.abs(lv-rv)<=1.5)near.push(ax);rows+='<div class="axis"><div class="axishead"><span>'+lab[ax][0]+' '+lp+'%</span><span>'+rp+'% '+lab[ax][1]+'</span></div><div class="track"><div class="l" style="width:'+lp+'%"></div><div class="r" style="width:'+rp+'%"></div></div><div class="conf">'+ch+'：'+cf(Math.abs(lv-rv))+'</div></div>'}app.innerHTML='<section class="card"><div class="eyebrow">你的四向度偏好</div><div class="result">'+type+'</div><p>'+esc(DESC[type])+'</p>'+rows+'<div class="note">'+(near.length?"有向度非常接近中線，表示你在不同情境可能彈性使用兩側偏好；四碼顯示本次略高的一側。":"四個向度都已產生可區分的偏好。強度代表本次回答的相對傾向，不等於能力高低。")+'</div><button class="primary" id="restart">重新測驗</button></section>';document.getElementById("restart").onclick=intro;window.scrollTo(0,0)}
