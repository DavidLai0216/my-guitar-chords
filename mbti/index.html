<title>四向度人格偏好測驗</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--text:#1d2430;--muted:#6e7682;--line:#e2e5eb;--accent:#4454b8;--soft:#eef0ff}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Segoe UI",sans-serif}
.wrap{max-width:720px;margin:auto;padding:16px 12px 48px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 10px 28px rgba(20,30,60,.06)}
h1{font-size:30px;line-height:1.22;margin:4px 0 12px}.eyebrow{font-size:13px;font-weight:800;letter-spacing:.08em;color:var(--accent);margin-bottom:8px}
p{font-size:16px;line-height:1.75}.muted{color:var(--muted)}
.primary,.choice{width:100%;font:inherit;border-radius:15px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.primary{border:0;background:var(--accent);color:#fff;padding:16px;font-weight:800;font-size:17px;margin-top:12px}
.choice{border:1.5px solid var(--line);background:#fff;padding:18px;text-align:left;font-weight:700;line-height:1.55;font-size:16px}.choice:active{background:var(--soft);border-color:var(--accent)}
.choices{display:grid;gap:12px}.top{display:flex;align-items:center;gap:12px;margin-bottom:18px}.progress{height:9px;background:#edf0f4;border-radius:99px;overflow:hidden;flex:1}.bar{height:100%;background:var(--accent)}.count{font-size:13px;color:var(--muted);min-width:54px;text-align:right}
.q{font-size:22px;font-weight:800;line-height:1.5;margin:18px 0}.back{border:0;background:transparent;color:var(--muted);padding:18px 0 0;font-size:15px}
.note{margin-top:18px;background:#f7f8fc;border-radius:14px;padding:15px;line-height:1.65;color:#58606b}.small{font-size:13px}
.result{font-size:56px;font-weight:900;letter-spacing:.05em;margin:4px 0 6px}
.typeLabel{font-size:20px;font-weight:800;margin:0 0 10px}.sectionTitle{font-size:18px;font-weight:900;margin:26px 0 10px}.miniGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini{background:#f7f8fc;border-radius:13px;padding:13px;line-height:1.55}.mini b{display:block;margin-bottom:4px}.shareRow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.secondary{font:inherit;border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;font-weight:750}.axis{margin:20px 0}.axishead{display:flex;justify-content:space-between;font-weight:800;font-size:14px;margin-bottom:7px}.track{height:15px;background:#e9ecf2;border-radius:99px;overflow:hidden;display:flex}.l{height:100%;background:#4454b8}.r{height:100%;background:#bbc1ea}.conf{font-size:13px;color:var(--muted);margin-top:6px}
@media(min-width:700px){.wrap{padding-top:30px}.card{padding:30px}.q{font-size:24px}}
</style>

var DESC={"ISTJ":"重視事實、結構與可靠執行，通常偏好清楚標準與可預期的節奏。","ISFJ":"重視實際需求與人際照顧，常以穩定、細緻的方式支持團隊。","INFJ":"傾向從長期意義與人的需要出發，重視一致的價值與方向。","INTJ":"喜歡建立模型與長期策略，傾向獨立思考並把想法系統化。","ISTP":"偏好直接理解問題運作方式，善於在現場以務實方式排除障礙。","ISFP":"重視真實感受與個人價值，通常彈性高，也敏銳於當下環境。","INFP":"重視內在價值與可能性，常從理想、意義與人的獨特性思考。","INTP":"喜歡拆解概念與邏輯，對模型、原理與新假設特別有興趣。","ESTP":"行動快、重視現場資訊，通常喜歡直接嘗試並即時調整。","ESFP":"重視互動與當下體驗，通常能快速感受環境與他人的反應。","ENFP":"容易從人與點子中看到新可能，喜歡探索並連結不同想法。","ENTP":"喜歡挑戰既有假設、探索替代方案，常透過討論發展新觀點。","ESTJ":"重視效率、秩序與執行，通常善於把目標轉成明確行動。","ESFJ":"重視合作、責任與群體需要，常主動維持團隊運作與關係。","ENFJ":"重視人的成長與共同方向，常能整合觀點並推動合作。","ENTJ":"偏好明確目標、策略與決策，常把複雜問題整理成可執行架構。"};

ESFP:["互動型行動者","有感染力、敏銳於現場與他人反應","可能較不喜歡抽象規劃與長時間延後回饋"],
ENFP:["可能型連結者","善於連結人與點子、看到新方向","可能因新機會太多而分散注意力"],

ESTJ:["結構型推進者","重視效率、責任、秩序與落地","可能在追求明確結論時壓縮探索空間"],
ESFJ:["關係型組織者","善於協調合作、照顧群體運作","可能過度承擔他人期待"],
ENFJ:["整合型帶領者","擅長理解人、形成共識並推動方向","可能把太多責任放在自己身上"],
ENTJ:["策略型推進者","擅長定義目標、整合資源與推動決策","可能在追求速度與成果時低估不同人的調適節奏"]
};
var AXISINFO={
E:["外向 E","透過互動、對話與外在刺激形成能量與想法"],
I:["內向 I","透過獨處、內在整理與深度專注形成能量與想法"],
S:["實感 S","先掌握具體資訊、案例、細節與可驗證事實"],
N:["直覺 N","先掌握模式、關聯、架構與尚未顯現的可能性"],
T:["思考 T","較自然依一致標準、邏輯與因果做判斷"],
F:["情感 F","較自然把價值、關係與個別處境放入判斷"],
J:["判斷 J","偏好較早形成結構、節點與可執行決定"],
P:["感知 P","偏好保持選項開放，依新資訊持續調整"]
};
var app=document.getElementById("app");
var st={phase:"intro",i:0,a:[],cq:[],ca:[],started:0};
var lab={EI:["E 外向","I 內向"],SN:["S 實感","N 直覺"],TF:["T 思考","F 情感"],JP:["J 判斷","P 感知"]};
function esc(s){return String(s).replace(/[&<>"]/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]})}
function intro(){app.innerHTML='<section class="card"><div class="eyebrow">68 題核心題＋必要時校準題 · 約 6–9 分鐘</div><h1>四向度人格偏好測驗</h1><p>用日常情境觀察你在 <b>E/I、S/N、T/F、J/P</b> 四個向度上的自然偏好。</p><p class="muted">前 68 題為核心題；若某個向度的核心支持度不足，系統會自動針對最不確定的向度追加 5 題校準。請選「比較像平常的你」，不是「理想中的你」。A/B 位置已交錯安排，請不要依按鍵位置作答。</p><button class="primary" id="start">開始測驗</button><div class="note small">本測驗為自製的四向度人格偏好工具，並非 The Myers-Briggs Company 的官方 MBTI® 評量；適合自我探索，不宜作為人事甄選、醫療或心理診斷依據。</div></section>';document.getElementById("start").onclick=function(){st={phase:"core",i:0,a:[],cq:[],ca:[],started:Date.now()};render()}}
function render(){var c=st.phase==="cal",n=c?68+st.i:st.i,x=c?st.cq[st.i]:Q[st.i],total=c?68+st.cq.length:68;app.innerHTML='<section class="card"><div class="top"><div class="progress"><div class="bar" style="width:'+(n/total*100)+'%"></div></div><div class="count">'+(n+1)+' / '+total+'</div></div><div class="eyebrow">'+(c?"校準題":"情境題")+'</div><div class="q">'+esc(c?"校準題：哪一個描述更接近平常的你？":x[0])+'</div><div class="choices"><button class="choice" id="a">A　'+esc(c?x[0]:x[1])+'</button><button class="choice" id="b">B　'+esc(c?x[1]:x[2])+'</button></div>'+(n?'<button class="back" id="back">← 上一題</button>':'')+'</section>';document.getElementById("a").onclick=function(){ans("a")};document.getElementById("b").onclick=function(){ans("b")};var b=document.getElementById("back");if(b)b.onclick=back;window.scrollTo(0,0)}
function ans(k){if(st.phase==="core"){st.a[st.i]=k;st.i++;if(st.i===68)prep();else render()}else{st.ca[st.i]=k;st.i++;if(st.i===st.cq.length)result();else render()}}
function back(){if(st.phase==="core"){if(st.i){st.i--;render()}}else{if(st.i){st.i--;render()}else{st.phase="core";st.i=67;render()}}}
function raw(){var s={E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};for(var i=0;i<Q.length;i++){var x=Q[i],k=st.a[i];if(k)s[k==="a"?x[3]:x[4]]++}return s}
function wilson(k,n){var z=1.645,p=k/n,den=1+z*z/n,center=(p+z*z/(2*n))/den,half=z*Math.sqrt(p*(1-p)/n+z*z/(4*n*n))/den;return [center-half,center+half]}
function strongEnough(a,b,n){var hi=Math.max(a,b),ci=wilson(hi,n);return ci[0]>0.5}
function prep(){var s=raw(),axes=[["EI","E","I"],["SN","S","N"],["TF","T","F"],["JP","J","P"]],need=[];for(var i=0;i<axes.length;i++){var d=axes[i],a=s[d[1]],b=s[d[2]];if(!strongEnough(a,b,17))need.push([d[0],Math.abs(a-b)])}need.sort(function(a,b){return a[1]-b[1]});st.cq=[];var use=need.slice(0,2);for(var u=0;u<use.length;u++){var ax=use[u][0];for(var j=0;j<5;j++){var z=CAL[ax][j];st.cq.push([z[0],z[1],z[2],z[3],ax])}}if(st.cq.length===0){result();return}st.phase="cal";st.i=0;render()}
function finalScore(){var s=raw();for(var i=0;i<st.cq.length;i++){var x=st.cq[i],k=st.ca[i];if(k)s[k==="a"?x[2]:x[3]]+=.5}return s}
function cf(d){return d<=1.5?"接近中線":d<=4.5?"中度傾向":"明顯傾向"}
function responseQuality(){
 var all=st.a.concat(st.ca),aN=0,bN=0;
 for(var i=0;i<all.length;i++){if(all[i]==="a")aN++;if(all[i]==="b")bN++}
 var total=aN+bN,elapsed=st.started?Math.round((Date.now()-st.started)/1000):9999,issues=[];
 if(total>=68&&elapsed<120)issues.push("完成速度非常快（約 "+elapsed+" 秒）");
 if(total&&Math.max(aN,bN)/total>=0.85)issues.push("A/B 按鍵選擇高度集中");
 return {elapsed:elapsed,a:aN,b:bN,issues:issues};
}
function result(){var s=finalScore(),defs=[["EI","E","I"],["SN","S","N"],["TF","T","F"],["JP","J","P"]],forced="",display="",rows="",near=[],chosen=[];for(var i=0;i<defs.length;i++){var d=defs[i],ax=d[0],l=d[1],r=d[2],lv=s[l],rv=s[r],calN=0;for(var q=0;q<st.cq.length;q++)if(st.cq[q][4]===ax)calN++;var n=17+calN,lp=Math.round(lv/(lv+rv)*100),rp=100-lp,ch=lv>rv?l:r,isNear=!strongEnough(lv,rv,n);forced+=ch;display+=isNear?"X":ch;chosen.push(ch);if(isNear)near.push(ax);var hi=Math.max(lv,rv),ci=wilson(hi,n),loCI=Math.round(ci[0]*100),hiCI=Math.round(ci[1]*100);rows+='<div class="axis"><div class="axishead"><span>'+lab[ax][0]+' '+lp+'%</span><span>'+rp+'% '+lab[ax][1]+'</span></div><div class="track"><div class="l" style="width:'+lp+'%"></div><div class="r" style="width:'+rp+'%"></div></div><div class="conf">'+(isNear?"90% 區間仍跨 50%；本次略偏 "+ch:ch+"：90% 區間約 "+loCI+"–"+hiCI+"%，未跨中線")+'</div></div>'}
var meta=TYPEMETA[forced],cards="";for(var j=0;j<chosen.length;j++){var z=AXISINFO[chosen[j]];cards+='<div class="mini"><b>'+z[0]+'</b>'+z[1]+'</div>'}
var rq=responseQuality(),qualityNote=rq.issues.length?'<div class="note"><b>作答品質提醒</b><br>'+rq.issues.join("；")+'。這不會自動改變分數，但建議把結果視為較低信心的參考。</div>':'';
app.innerHTML='<section class="card"><div class="eyebrow">你的四向度偏好</div><div class="result">'+display+'</div><div class="typeLabel">'+(display.indexOf("X")>=0?"不確定向度以 X 標示｜參考四碼 "+forced:meta[0])+'</div><p>'+(display.indexOf("X")>=0?'至少一個向度目前仍缺乏足夠一致的題目支持，因此主結果不硬判；下面仍提供本次略高一側的四碼作為參考。':esc(DESC[forced]))+'</p>'+rows+'<div class="note">'+(near.length?'X 代表目前題目證據不足，不代表你沒有性格傾向。百分比是本次作答偏好指數，不是人格機率。':'四個向度都有較一致的題目支持。百分比是本次作答偏好指數，不是人格機率。')+'</div>'+qualityNote+'<div class="sectionTitle">你的四個偏好怎麼看</div><div class="miniGrid">'+cards+'</div><div class="sectionTitle">可能的優勢與提醒</div><div class="mini"><b>常見優勢</b>'+meta[1]+'</div><div class="mini" style="margin-top:10px"><b>可留意</b>'+meta[2]+'</div><div class="shareRow"><button class="secondary" id="copy">複製結果</button><button class="secondary" id="restart">重新測驗</button></div><div class="note small"><a href="qa.html" style="color:#4454b8">查看測驗設計與壓力測試說明</a></div></section>';
document.getElementById("restart").onclick=intro;document.getElementById("copy").onclick=function(){var txt="我的人格偏好測驗結果："+display+(display.indexOf("X")>=0?"（參考四碼 "+forced+"）":" "+meta[0]);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(function(){document.getElementById("copy").innerText="已複製"}).catch(function(){alert(txt)})}else{alert(txt)}};window.scrollTo(0,0)}
intro();
</script></body></html>
